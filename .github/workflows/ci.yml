name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run unit and pure-git integration test suite
        run: PYTHONDONTWRITEBYTECODE=1 python3 -W default -m unittest discover -s tests -v
      - name: Verify per-entry plugin symlink installer
        run: |
          ./scripts/install-plugin --plugin-dir /tmp/keel-plugin-ci --no-bin
          ./scripts/install-plugin --plugin-dir /tmp/keel-plugin-ci --no-bin --check
          rm -rf /tmp/keel-plugin-ci
